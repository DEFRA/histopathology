  - stage: HistologyReferenceReset
    displayName: Histology Reference Reset
    condition: or(eq(variables['Build.Reason'], 'Schedule'), eq('${{ parameters.runHistologyReferenceReset }}', true))
    jobs:
      - job: reset_dev
        displayName: 'Reset histology reference (DEV)'
        condition: or(eq(variables['Build.Reason'], 'Schedule'), eq('${{ parameters.resetHistologyRefDev }}', true))
        pool:
          name: 'DEFRA-COMMON-UBUNTU-SSV3'
        variables:
          sqlServerHost: 'devcdeinfsq1401.database.windows.net'
          dbName: 'histopathology'
        steps:
          - task: AzureCLI@2
            displayName: 'Execute EditResetHistologyRef (DEV)'
            inputs:
              azureSubscription: 'AZR-CDE-DEV1'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                TOOLS="$(Agent.TempDirectory)/sqlcmd"
                mkdir -p "$TOOLS"
                curl -sSL --fail --max-time 60 -o "$TOOLS/sqlcmd.tar.bz2" \
                  https://github.com/microsoft/go-sqlcmd/releases/download/v1.8.2/sqlcmd-linux-amd64.tar.bz2
                tar -xjf "$TOOLS/sqlcmd.tar.bz2" -C "$TOOLS"

                echo "Executing dbo.EditResetHistologyRef against $(sqlServerHost)/$(dbName)"
                "$TOOLS/sqlcmd" -S "$(sqlServerHost)" -d "$(dbName)" \
                  --authentication-method ActiveDirectoryAzCli \
                  -Q "EXECUTE dbo.EditResetHistologyRef" -b

      - job: reset_tst
        displayName: 'Reset histology reference (TST)'
        condition: or(eq(variables['Build.Reason'], 'Schedule'), eq('${{ parameters.resetHistologyRefTest }}', true))
        pool:
          name: 'DEFRA-COMMON-UBUNTU-SSV3'
        variables:
          sqlServerHost: 'tstcdeinfsq1401.database.windows.net'
          dbName: 'histopathology'
        steps:
          - task: AzureCLI@2
