              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                TOOLS="$(Agent.TempDirectory)/sqlcmd"
                mkdir -p "$TOOLS"
                curl -sSL --fail --max-time 60 -o "$TOOLS/sqlcmd.tar.bz2" \
                  https://github.com/microsoft/go-sqlcmd/releases/download/v1.8.2/sqlcmd-linux-amd64.tar.bz2
                tar -xjf "$TOOLS/sqlcmd.tar.bz2" -C "$TOOLS"

                echo "Executing dbo.EditResetHistologyRef against $(sqlServerHost)/$(dbName)"
                "$TOOLS/sqlcmd" -S "$(sqlServerHost)" -d "$(dbName)" \
                  --authentication-method ActiveDirectoryAzCli \
                  -Q "EXECUTE dbo.EditResetHistologyRef" -b

      - job: reset_preprod
        displayName: 'Reset histology reference (Pre-Prod)'
        condition: or(eq(variables['Build.Reason'], 'Schedule'), eq('${{ parameters.resetHistologyRefPreProd }}', true))
        pool:
          name: 'DEFRA-COMMON-UBUNTU-SSV5'
        variables:
          sqlServerHost: 'precdeinfsq1401.database.windows.net'
          dbName: 'histopathology'
        steps:
          - task: AzureCLI@2
            displayName: 'Execute EditResetHistologyRef (Pre-Prod)'
            inputs:
              azureSubscription: 'AZR-CDE-PRE1'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                TOOLS="$(Agent.TempDirectory)/sqlcmd"
                mkdir -p "$TOOLS"
                curl -sSL --fail --max-time 60 -o "$TOOLS/sqlcmd.tar.bz2" \
                  https://github.com/microsoft/go-sqlcmd/releases/download/v1.8.2/sqlcmd-linux-amd64.tar.bz2
                tar -xjf "$TOOLS/sqlcmd.tar.bz2" -C "$TOOLS"

                echo "Executing dbo.EditResetHistologyRef against $(sqlServerHost)/$(dbName)"
                "$TOOLS/sqlcmd" -S "$(sqlServerHost)" -d "$(dbName)" \
                  --authentication-method ActiveDirectoryAzCli \
                  -Q "EXECUTE dbo.EditResetHistologyRef" -b
