trigger:
  branches:
    include:
      - develop
      - main

# Cron cadence is a literal, since Azure Pipelines resolves `schedules:` at
# compile time before the `variables:` block exists - a ${{ variables.x }}
# reference here fails with "A template expression is not allowed in this
# context". To change the cadence, edit the cron literal below directly.
schedules:
  - cron: '0 4 1 1 *'
    displayName: 'Histology reference reset (annual, 1 Jan)'
    branches:
      include:
        - develop
    always: true

parameters:
  - name: deployToDev
    displayName: Deploy to DEV
    type: boolean
    default: true

  - name: deployToTest
    displayName: Deploy to TST
    type: boolean
    default: false

  - name: deployToPreProd
    displayName: Deploy to Pre-Prod
    type: boolean
    default: false

  - name: runSonar
    displayName: Run SonarCloud analysis
    type: boolean
    default: false

  - name: runDatabaseScripts
    displayName: Run database deployment scripts (even when no scripts changed)
    type: boolean
    default: false

  - name: sonarServiceConnection
    type: string
    default: 'SonarCloud-Histo'

  - name: runHistologyReferenceReset
    displayName: Run histology reference reset (EditResetHistologyRef)
    type: boolean
    default: false

  - name: resetHistologyRefDev
    displayName: Reset histology reference in DEV
    type: boolean
    default: true

  - name: resetHistologyRefTest
    displayName: Reset histology reference in TST
    type: boolean
    default: false

  - name: resetHistologyRefPreProd
    displayName: Reset histology reference in Pre-Prod
    type: boolean
    default: false

  # - name: deployToProd
  #   displayName: Deploy to PROD
  #   type: boolean
  #   default: false

variables:
  - name: buildConfiguration
    value: 'Release'
  - name: solution
    value: 'HistopathologySystem.slnx'
  - name: webProject
    value: 'src/Histo.Web/Histo.Web.csproj'
  - name: databaseScriptsPath
    value: 'src/Database'

stages:
  - stage: Build
    displayName: Build and Test
    condition: ne(variables['Build.Reason'], 'Schedule')
    jobs:
      - job: build
        pool:
          vmImage: 'ubuntu-24.04'
        steps:
          - checkout: self
            fetchDepth: 0
            persistCredentials: false

          - task: UseDotNet@2
            displayName: 'Install .NET 10 SDK'
            inputs:
              version: '10.0.x'
              includePreviewVersions: true

          - ${{ if eq(parameters.runSonar, true) }}:
            - task: SonarCloudPrepare@4
              displayName: 'Prepare Sonar analysis'
              condition: ne(variables['Build.Reason'], 'PullRequest')
              inputs:
                SonarCloud: ${{ parameters.sonarServiceConnection }}
                organization: 'defra'
                scannerMode: 'dotnet'
                projectKey: 'DEFRA_histopathology'
                projectName: 'Histopathology'
                extraProperties: |
                  sonar.cs.opencover.reportsPaths=$(Agent.TempDirectory)/**/coverage.opencover.xml

          - script: |
              dotnet --info
              echo "--- files in working directory ---"
              ls -la
            displayName: 'Diagnostics'

          - script: dotnet restore $(solution)
            displayName: 'Restore dependencies'

          - script: dotnet build $(solution) --configuration $(buildConfiguration) --no-restore
            displayName: 'Build'

          - script: dotnet test $(solution) --configuration $(buildConfiguration) --no-build --logger trx --collect:"XPlat Code Coverage;Format=opencover" --results-directory $(Agent.TempDirectory)
            displayName: 'Run tests'

          - task: PublishTestResults@2
            displayName: 'Publish test results'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: '**/*.trx'
              searchFolder: '$(Agent.TempDirectory)'

          - task: DotNetCoreCLI@2
            displayName: 'Publish Histo.Web'
            inputs:
              command: publish
              publishWebProjects: false
              projects: '$(webProject)'
              arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
              zipAfterPublish: true

          - task: CopyFiles@2
            displayName: 'Stage SQL scripts'
            inputs:
              sourceFolder: 'src/Database'
              contents: '**/*.sql'
              targetFolder: '$(Build.ArtifactStagingDirectory)/sql'

          - bash: |
              set -euo pipefail

              # Detect whether any file under the database scripts path (src/Database —
              # covering Deploy/, Migrations/, StoredProcedures/) changed, so downstream
              # deployment stages can skip applying database scripts when there are no
              # script changes to deploy.
              if [ "$(Build.Reason)" = "PullRequest" ]; then
                DIFF_RANGE="origin/$(System.PullRequest.TargetBranch)...HEAD"
              else
                DIFF_RANGE="HEAD~1...HEAD"
              fi

              echo "Checking for database script changes using range: $DIFF_RANGE"

              if git diff --name-only $DIFF_RANGE -- $(databaseScriptsPath) | grep -q .; then
                echo "Database script changes detected under $(databaseScriptsPath):"
                git diff --name-only $DIFF_RANGE -- $(databaseScriptsPath)
                echo "##vso[task.setvariable variable=dbScriptsChanged;isOutput=true]true"
              else
                echo "No database script changes detected under $(databaseScriptsPath)."
                echo "##vso[task.setvariable variable=dbScriptsChanged;isOutput=true]false"
              fi
            name: detectDbChanges
            displayName: 'Detect database script changes'

          - publish: '$(Build.ArtifactStagingDirectory)'
            artifact: drop
            displayName: 'Publish artifact'

          - ${{ if eq(parameters.runSonar, true) }}:
            - task: SonarCloudAnalyze@4
              displayName: 'Run Sonar analysis'
              condition: and(succeededOrFailed(), ne(variables['Build.Reason'], 'PullRequest'))

            - task: SonarCloudPublish@4
              displayName: 'Publish quality gate result'
              condition: and(succeededOrFailed(), ne(variables['Build.Reason'], 'PullRequest'))
              inputs:
                pollingTimeoutSec: '300'

  - stage: DEV
    displayName: DEV
    dependsOn: Build
    # develop-only: DEV/TST deploy from develop, Pre-Prod/Prod deploy from main.
    condition: and(succeeded(), ne(variables['Build.Reason'], 'Schedule'), eq(variables['Build.SourceBranchName'], 'develop'), eq('${{ parameters.deployToDev }}', true))
    variables:
    - name: appName
      value: 'DEVCDEWEBAW1401'
    - name: tenantId
      value: '770a2450-0227-4c62-90c7-4e38537f1102'
    - name: appId
      value: '89060d89-195d-47f4-a900-2f66fba81a75'
    - name: sqlServer
      value: 'devcdeinfsq1401.database.windows.net,1433'
    - name: sqlServerHost
      value: 'devcdeinfsq1401.database.windows.net'
    - name: dbName
      value: 'histopathology'      
    - name: dbScriptsChanged
      value: $[ stageDependencies.Build.build.outputs['detectDbChanges.dbScriptsChanged'] ]
    jobs:
      - deployment: deploy_dev
        environment: 'dev'
        pool:
          name: 'DEFRA-COMMON-UBUNTU-SSV3'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: drop

                - script: |
                    set -euo pipefail

                    LOG_DIR="$(Agent.TempDirectory)/db-deploy-log"
                    mkdir -p "$LOG_DIR"
                    LOG_FILE="$LOG_DIR/db-deploy-DEV.log"

                    if [ "$(dbScriptsChanged)" = "true" ]; then
                      DECISION="Database script changes detected in this build - database deployment WILL be applied for DEV."
                    elif [ "${{ parameters.runDatabaseScripts }}" = "True" ] || [ "${{ parameters.runDatabaseScripts }}" = "true" ]; then
                      DECISION="'Run database deployment scripts' was selected (fresh / DR deployment) - database deployment WILL be applied for DEV."
                    else
                      DECISION="No database script changes and no manual request - database deployment WILL BE SKIPPED for DEV."
                    fi

                    {
                      echo "============================================================"
                      echo " Database deployment - DEV"
                      echo "============================================================"
                      printf 'Decided at : %(%Y-%m-%dT%H:%M:%SZ)T\n' -1
                      echo "Server     : $(sqlServerHost)"
                      echo "Database   : $(dbName)"
                      echo "Build      : $(Build.BuildNumber)"
                      echo "Commit     : $(Build.SourceVersion)"
                      echo "Decision   : $DECISION"
                    } | tee "$LOG_FILE"
                  displayName: 'Log database deployment decision'

                - task: AzureCLI@2
                  displayName: 'Apply database scripts'
                  condition: or(eq(variables['dbScriptsChanged'], 'true'), eq('${{ parameters.runDatabaseScripts }}', true))
                  inputs:
                    azureSubscription: 'AZR-CDE-DEV1'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail

                      TOOLS="$(Agent.TempDirectory)/sqlcmd"
                      mkdir -p "$TOOLS"
                      curl -sSL --fail --max-time 60 -o "$TOOLS/sqlcmd.tar.bz2" \
                        https://github.com/microsoft/go-sqlcmd/releases/download/v1.8.2/sqlcmd-linux-amd64.tar.bz2
                      tar -xjf "$TOOLS/sqlcmd.tar.bz2" -C "$TOOLS"

                      LOG_FILE="$(Agent.TempDirectory)/db-deploy-log/db-deploy-DEV.log"
                      cd "$(Pipeline.Workspace)/drop/sql/Deploy"

                      if [ "$(dbScriptsChanged)" = "true" ]; then
                        TRIGGER="database script changes detected in this build"
                      else
                        TRIGGER="manually requested - fresh / DR deployment"
                      fi

                      # Deploy.sql is only a manifest of :r includes, so list them to log every script
                      # that ran. '|| true' because pipefail would abort the step if grep matched nothing.
                      {
                        echo
                        printf 'Started    : %(%Y-%m-%dT%H:%M:%SZ)T\n' -1
                        echo "Triggered  : $TRIGGER"
                        echo
                        echo "The following scripts will be applied, in order, to database '$(dbName)' on '$(sqlServerHost)':"
                        grep -E '^[[:space:]]*:r[[:space:]]' Deploy.sql | sed -E 's#^[[:space:]]*:r[[:space:]]*(\.\./)*#  - #' || true
                        echo
                        echo "--- sqlcmd output ---"
                      } | tee -a "$LOG_FILE"

                      "$TOOLS/sqlcmd" -S "$(sqlServerHost)" -d "$(dbName)" \
                        --authentication-method ActiveDirectoryAzCli \
                        -i "Deploy.sql" -b -t 0 2>&1 | tee -a "$LOG_FILE"

                      {
                        echo
                        printf 'Completed  : %(%Y-%m-%dT%H:%M:%SZ)T\n' -1
                        echo "The scripts listed above ran successfully against database '$(dbName)' on server '$(sqlServerHost)'."
                      } | tee -a "$LOG_FILE"

                - task: PublishPipelineArtifact@1
                  displayName: 'Publish database deployment log'
                  condition: and(succeededOrFailed(), or(eq(variables['dbScriptsChanged'], 'true'), eq('${{ parameters.runDatabaseScripts }}', true)))
                  inputs:
                    targetPath: '$(Agent.TempDirectory)/db-deploy-log'
                    artifactName: 'db-deploy-log-DEV'

                - task: AzureWebApp@1
                  inputs:
                    azureSubscription: 'AZR-CDE-DEV1'
                    appType: 'webAppLinux'
                    appName: '$(appName)'
                    package: '$(Pipeline.Workspace)/drop/*.zip'
                    runtimeStack: 'DOTNETCORE|10.0'
                    deploymentMethod: 'zipDeploy'
                    appSettings: >-
                      -Saml2__SPEntityId "https://dev-cde.azure.defra.cloud"
                      -Saml2__PublicOrigin "https://dev-cde.azure.defra.cloud"
                      -Saml2__IdPEntityId "https://sts.windows.net/$(tenantId)/"
                      -Saml2__IdPMetadataUrl "https://login.microsoftonline.com/$(tenantId)/federationmetadata/2007-06/federationmetadata.xml?appid=$(appId)"
                      -Authentication__Bypass "false"
                      -ConnectionStrings__HistologyDb "Server=tcp:$(sqlServer);Database=$(dbName);Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;Authentication=Active Directory Managed Identity;"


  - stage: TST
    displayName: TST
    dependsOn:
      - DEV
      - Build
    # develop-only: DEV/TST deploy from develop, Pre-Prod/Prod deploy from main.
    condition: and(in(dependencies.Build.result, 'Succeeded'), in(dependencies.DEV.result, 'Succeeded', 'Skipped'), ne(variables['Build.Reason'], 'Schedule'), eq(variables['Build.SourceBranchName'], 'develop'), eq('${{ parameters.deployToTest }}', true))
    variables:
    - name: appName
      value: 'TSTCDEWEBAW1401'
    - name: tenantId
      value: '770a2450-0227-4c62-90c7-4e38537f1102'
    - name: appId
      value: '2f7f564e-38a4-4cc7-aa92-0ee8c8cfc974'
    - name: sqlServer
      value: 'tstcdeinfsq1401.database.windows.net,1433'
    - name: sqlServerHost
      value: 'tstcdeinfsq1401.database.windows.net'
    - name: dbName
      value: 'histopathology'      
    - name: dbScriptsChanged
      value: $[ stageDependencies.Build.build.outputs['detectDbChanges.dbScriptsChanged'] ]
    jobs:
      - deployment: deploy_tst
        environment: 'test'
        pool:
          name: 'DEFRA-COMMON-UBUNTU-SSV3'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: drop

                - script: |
                    set -euo pipefail

                    LOG_DIR="$(Agent.TempDirectory)/db-deploy-log"
                    mkdir -p "$LOG_DIR"
                    LOG_FILE="$LOG_DIR/db-deploy-TST.log"

                    if [ "$(dbScriptsChanged)" = "true" ]; then
                      DECISION="Database script changes detected in this build - database deployment WILL be applied for TST."
                    elif [ "${{ parameters.runDatabaseScripts }}" = "True" ] || [ "${{ parameters.runDatabaseScripts }}" = "true" ]; then
                      DECISION="'Run database deployment scripts' was selected (fresh / DR deployment) - database deployment WILL be applied for TST."
                    else
                      DECISION="No database script changes and no manual request - database deployment WILL BE SKIPPED for TST."
                    fi

                    {
                      echo "============================================================"
                      echo " Database deployment - TST"
                      echo "============================================================"
                      printf 'Decided at : %(%Y-%m-%dT%H:%M:%SZ)T\n' -1
                      echo "Server     : $(sqlServerHost)"
                      echo "Database   : $(dbName)"
                      echo "Build      : $(Build.BuildNumber)"
                      echo "Commit     : $(Build.SourceVersion)"
                      echo "Decision   : $DECISION"
                    } | tee "$LOG_FILE"
                  displayName: 'Log database deployment decision'

                - task: AzureCLI@2
                  displayName: 'Apply database scripts'
                  condition: or(eq(variables['dbScriptsChanged'], 'true'), eq('${{ parameters.runDatabaseScripts }}', true))
                  inputs:
                    azureSubscription: 'AZR-CDE-TST1'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail

                      TOOLS="$(Agent.TempDirectory)/sqlcmd"
                      mkdir -p "$TOOLS"
                      curl -sSL --fail --max-time 60 -o "$TOOLS/sqlcmd.tar.bz2" \
                        https://github.com/microsoft/go-sqlcmd/releases/download/v1.8.2/sqlcmd-linux-amd64.tar.bz2
                      tar -xjf "$TOOLS/sqlcmd.tar.bz2" -C "$TOOLS"

                      LOG_FILE="$(Agent.TempDirectory)/db-deploy-log/db-deploy-TST.log"
                      cd "$(Pipeline.Workspace)/drop/sql/Deploy"

                      if [ "$(dbScriptsChanged)" = "true" ]; then
                        TRIGGER="database script changes detected in this build"
                      else
                        TRIGGER="manually requested - fresh / DR deployment"
                      fi

                      # Deploy.sql is only a manifest of :r includes, so list them to log every script
                      # that ran. '|| true' because pipefail would abort the step if grep matched nothing.
                      {
                        echo
                        printf 'Started    : %(%Y-%m-%dT%H:%M:%SZ)T\n' -1
                        echo "Triggered  : $TRIGGER"
                        echo
                        echo "The following scripts will be applied, in order, to database '$(dbName)' on '$(sqlServerHost)':"
