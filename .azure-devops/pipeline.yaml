                      cd "$(Pipeline.Workspace)/drop/sql/Deploy"

                      if [ "$(dbScriptsChanged)" = "true" ]; then
                        TRIGGER="database script changes detected in this build"
                      else
                        TRIGGER="manually requested - fresh / DR deployment"
                      fi

                      # Deploy.sql is only a manifest of :r includes, so list them to log every script
                      # that ran. '|| true' because pipefail would abort the step if grep matched nothing.
                      {
                        echo
                        printf 'Started    : %(%Y-%m-%dT%H:%M:%SZ)T\n' -1
                        echo "Triggered  : $TRIGGER"
                        echo
                        echo "The following scripts will be applied, in order, to database '$(dbName)' on '$(sqlServerHost)':"
